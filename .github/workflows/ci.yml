name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Um deploy aceito pelo provedor continua mesmo se o runner for cancelado.
  # Serializar main evita abandonar o monitoramento de uma publicação ativa.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint e testes offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-optimization.txt

      - name: Instalar dependências
        id: install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check .

      - name: Instalar dependências da otimização
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip install -r requirements-optimization.txt

      - name: Testes da otimização GA e NSGA-II
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: python -m unittest research.tests.test_optimization -v

      # Executar também quando o lint falhar, para o PR mostrar os dois resultados.
      - name: Testes offline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: python tests/run_offline.py

      - name: Harness de métricas fuzzy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: src
        run: python tools/fuzzy_metrics.py

      - name: Publicar relatório fuzzy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-metrics
          path: docs/validation/fuzzy-metrics.md

  frontend:
    name: Frontend offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do build
        working-directory: frontend
        run: npm ci
      - name: Testar contratos do frontend
        working-directory: frontend
        run: npm test
      - name: Recompilar assets locais
        working-directory: frontend
        run: npm run build
      - name: Conferir assets versionados
        run: git diff --exit-code -- src/netsentinel/api/static

  container:
    name: Container e Postgres sintéticos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preparar credenciais efêmeras de CI
        run: |
          python -m pip install Werkzeug
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex
          from werkzeug.security import generate_password_hash
          password = token_hex(24)
          Path('.env.docker').write_text(
              'SYNTHETIC_POSTGRES_PASSWORD=' + token_hex(32) + '\n'
              'SYNTHETIC_SECRET_KEY=' + token_hex(32) + '\n'
              'SYNTHETIC_OPERATOR_USERNAME=operador\n'
              'SYNTHETIC_OPERATOR_PASSWORD=' + password + '\n'
              "SYNTHETIC_OPERATOR_PASSWORD_HASH='" + generate_password_hash(password) + "'\n"
          )
          PY
      - name: Validar configuração, construir e subir
        run: |
          docker compose --env-file .env.docker config --quiet
          docker compose --env-file .env.docker up --build --wait --wait-timeout 180
      - name: Verificar HTTP e sessão
        run: python tests/container_smoke.py
      - name: Verificar revisão Alembic no Postgres real
        run: |
          docker compose --env-file .env.docker exec -T postgres psql -U netsentinel -d netsentinel -v ON_ERROR_STOP=1 -c 'SELECT version_num FROM alembic_version;'
      - name: Encerrar ambiente efêmero
        if: always()
        run: docker compose --env-file .env.docker down --volumes

  deploy:
    name: Deploy acadêmico Render
    needs: [quality, frontend, container]
    # Em PR não há acesso às credenciais. Criar a variável somente após o setup.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: academic-cloud
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Conferir configuração antes de publicar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          CLOUD_URL: ${{ vars.CLOUD_URL }}
          CLOUD_OPERATOR_USERNAME: ${{ vars.CLOUD_OPERATOR_USERNAME }}
          CLOUD_OPERATOR_PASSWORD: ${{ secrets.CLOUD_OPERATOR_PASSWORD }}
        run: |
          python - <<'PYCONFIG'
          import os
          from tools.cloud_smoke import validate_url
          names = ('RENDER_API_KEY', 'RENDER_SERVICE_ID', 'CLOUD_URL',
                   'CLOUD_OPERATOR_USERNAME', 'CLOUD_OPERATOR_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configuração ausente: ' + ', '.join(missing))
          validate_url(os.environ['CLOUD_URL'])
          PYCONFIG
      - name: Publicar o commit aprovado e aguardar live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python tools/render_deploy.py
      - name: Verificar HTTPS e sessão na nuvem
        env:
          CLOUD_URL: ${{ vars.CLOUD_URL }}
          CLOUD_OPERATOR_USERNAME: ${{ vars.CLOUD_OPERATOR_USERNAME }}
          CLOUD_OPERATOR_PASSWORD: ${{ secrets.CLOUD_OPERATOR_PASSWORD }}
        run: python tools/cloud_smoke.py
      - name: Guardar evidência do deploy e do smoke aprovado
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deploy-${{ github.sha }}
          path: deploy-evidence.json
          retention-days: 90
